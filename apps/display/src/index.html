<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STREAK Display</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #080808; color: #fff; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 20%, #321408, #080808 60%); }
      #app { min-height: 100vh; display: grid; place-items: center; }
      main { width: min(92vw, 1100px); text-align: center; }
      h1 { font-size: clamp(2rem, 5vw, 5rem); margin: 0 0 2rem; }
      ol { list-style: none; padding: 0; margin: 0; }
      li { display: flex; justify-content: space-between; gap: 1rem; padding: 1rem 1.5rem; margin: .5rem 0; border-radius: .75rem; background: #191919; font-size: clamp(1.1rem, 2.4vw, 2.2rem); }
      li span { color: #ffb347; }
      .welcome { background: rgba(0,0,0,.7); padding: 4rem 2rem; border: 3px solid #ff7a00; border-radius: 2rem; }
      .flame { font-size: 7rem; }
      .welcome p { color: #ffb347; font-size: clamp(2rem, 6vw, 6rem); font-weight: 800; margin: 1rem 0; }
      small { font-size: 1.5rem; color: #ddd; }
    </style>
  </head>
  <body><div class="demo">DEMO MODE</div><div id="app"></div><script type="module" src="./client.ts"></script></body>
</html>
